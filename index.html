<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selah</title>
<meta name="description" content="Ten seconds of scripture between you and the scroll. Selah for iPhone.">
<style>
  :root { --paper:#EFE9DC; --ink:#22283A; --soft:#3a3730; --muted:#8a8578; --clay:#C77B54; --line:#E3DBCB; }
  body { margin:0; background:var(--paper); color:var(--soft); display:grid; place-items:center; min-height:100vh;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .card { text-align:center; padding: 2rem 1.25rem; }
  svg { display:block; margin: 0 auto 1rem; }
  h1 { font-size: 1.9rem; color: var(--ink); font-weight: 600; margin: 0 0 .25rem; letter-spacing:-.01em; }
  p { color: var(--muted); margin: 0 0 1.75rem; }
  a { color: var(--clay); margin: 0 .6rem; }
  .lede { color: var(--soft); max-width: 22rem; margin: 0 auto 1.75rem; }
  .download { display: inline-block; margin: 0 0 2rem; padding: .85rem 1.6rem; border-radius: 999px;
    background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600; }
  .legal { font-size: .9rem; }
</style>
</head>
<body>
  <div class="card">
    <!-- the fermata: a hold, which is what selah means -->
    <svg width="72" height="49" viewBox="0 0 96 66" aria-hidden="true">
      <path d="M11 55 A37 37 0 0 1 85 55" fill="none" stroke="#22283A" stroke-width="6" stroke-linecap="round"/>
      <circle cx="48" cy="45" r="8.6" fill="#C77B54"/>
    </svg>
    <h1>Selah</h1>
    <p>A pause before the scroll.</p>
    <p class="lede">When you reach for the app that keeps pulling you back, Selah meets you first with ten seconds of scripture. Then the choice is yours.</p>
    <a class="download" href="https://apps.apple.com/us/app/selah-less-scroll-more-word/id6800972026">Download on the App Store</a>
    <div class="legal"><a href="./privacy.html">Privacy Policy</a><a href="./terms.html">Terms of Use</a></div>
  </div>
</body>
</html>
